server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Performance I/O
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    client_max_body_size 500M;

    # Compression Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache des assets statiques (CSS, JS, Fonts)
    location ~* \.(css|js|woff2?|ttf|svg)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Ne pas cacher le fichier de projets
    location = /projects.json {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Dossier de téléchargement des binaires et archives de projets
    location /downloads/ {
        alias /usr/share/nginx/html/downloads/;
        autoindex off;
        # Forcer le téléchargement des binaires et archives
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=3600";
    }

    # Routage du site
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
}
