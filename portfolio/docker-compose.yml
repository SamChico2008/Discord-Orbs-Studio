services:
  # Serveur web Nginx ultra-léger pour héberger le portfolio et les téléchargements
  portfolio:
    image: nginx:alpine
    container_name: portfolio-vault
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./downloads:/usr/share/nginx/html/downloads:ro
    environment:
      - TZ=Europe/Paris
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # [OPTIONNEL] Tunnel Cloudflare Zero Trust pour accès public direct en HTTPS (sans ouvrir de port sur la box)
  # Pour l'activer : décommentez le bloc ci-dessous et insérez le jeton de votre tunnel Cloudflare.
  # tunnel:
  #   image: cloudflare/cloudflared:latest
  #   container_name: portfolio-tunnel
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run --token VOTRE_TOKEN_CLOUDFLARE_ICI
  #   depends_on:
  #     - portfolio
